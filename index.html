const norm=s=>String(s||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/đ/g,"d").replace(/Đ/g,"D").toLowerCase().replace(/\s+/g," ").trim();
function parse(v){const m=v.trim().replace(/\s+/g," ").match(/^(\d+[A-Za-z]?(?:\/\d+[A-Za-z]?)*)\s+(.+)$/u);if(!m)return null;const ns=(m[1].match(/\d+/g)||[]).map(Number);return ns.length?{raw:v.trim(),main:ns[0],sub:ns.length>1?ns.at(-1):null,street:m[2].trim()}:null}
function parity(r,n){return r.parity==="Chẵn"?n%2===0:r.parity==="Lẻ"?n%2===1:true}
function inRange(r,a){const s=r.range.trim(),n=norm(s);if(n.includes("toan bo"))return true;if(s.toUpperCase()==="X"||n.includes("nguon khong ghi"))return false;return s.replace(/[—−]/g,"–").split(/\s*[,;]\s*/).some(f=>{const x=(f.match(/\d+/g)||[]).map(Number);if(!x.length)return false;if(f.includes("/")&&x.length>=4){if(a.sub===null)return false;const [m1,s1,m2,s2]=x;return m1===m2?a.main===m1&&a.sub>=Math.min(s1,s2)&&a.sub<=Math.max(s1,s2):a.main>=Math.min(m1,m2)&&a.main<=Math.max(m1,m2)}if(x.length===1)return a.main===x[0]&&parity(r,a.main);return x[0]<=x[1]&&a.main>=x[0]&&a.main<=x[1]&&parity(r,a.main)})}
function search(q){const a=parse(q),status=document.querySelector("#status"),out=document.querySelector("#results");out.innerHTML="";if(!a){status.textContent="Nhập theo dạng: 60 Xuân Diệu";return}const found=records.filter(r=>r.tdp&&norm(r.street)===norm(a.street)&&inRange(r,a));if(!found.length){status.textContent="Không tìm thấy trong dữ liệu hiện có hoặc cần kiểm tra thủ công.";return}const groups=new Map;for(const r of found){if(!groups.has(r.tdp))groups.set(r.tdp,[]);groups.get(r.tdp).push(r)}status.textContent=groups.size===1?"Đã tìm thấy kết quả phù hợp.":"Địa chỉ khớp nhiều TDP – kiểm tra các khoảng bên dưới.";for(const [tdp,rows] of [...groups].sort((a,b)=>parseInt(a[0].replace(/\D/g,""))-parseInt(b[0].replace(/\D/g,"")))){const el=document.createElement("article");el.className="result";el.innerHTML='<div class="tdp">'+tdp+'</div>'+rows.map(r=>'<div class="detail"><strong>Khoảng '+r.range+'</strong><span>'+r.ward+' cũ · '+r.oldKp+' → '+r.newKp+'</span>'+(r.status!=="OK"?'<em>Cần đối chiếu nguồn: '+r.issue+'</em>':'')+'</div>').join("");out.appendChild(el)}}
document.querySelector("#form").addEventListener("submit",e=>{e.preventDefault();search(document.querySelector("#address").value)});document.querySelectorAll("[data-q]").forEach(b=>b.onclick=()=>{document.querySelector("#address").value=b.dataset.q;search(b.dataset.q)});
